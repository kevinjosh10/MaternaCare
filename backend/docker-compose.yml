version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: maternacare_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: maternacare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: maternacare_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/maternacare_db
      SECRET_KEY: maternacare-production-secret-key-replace-in-env
      API_V1_STR: /api/v1
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
